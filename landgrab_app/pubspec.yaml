name: landgrab
description: "LANDGRAB — barcode-scanning puzzle adventure."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  dio: ^5.4.3+1
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.2
  logger: ^2.4.0
  pretty_dio_logger: ^1.3.1

  mobile_scanner: ^7.2.0
  # Renders the team join QR on Settings (scanning stays with mobile_scanner).
  qr_flutter: ^4.1.0
  http: ^1.2.0
  flutter_map: ^6.1.0
  flutter_map_marker_cluster: ^1.3.6
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  flutter_web_auth_2: ^4.0.0
  sign_in_with_apple: ^7.0.0
  webview_flutter: ^4.10.0

  sentry_flutter: ^9.9.1
  sentry: any

  phoenix_socket: ^0.7.5

  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  nfc_manager: ^4.1.1

  shared_preferences: ^2.3.2
  flutter_map_compass: ^1.1.1
  flutter_compass: ^0.8.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

# Cold-start splash. Dark so there's no white flash before the (dark-themed)
# app renders its first frame. Source is a TEXT-ONLY wordmark — "LANDGRAB"
# over the site's "a settler habit simulation" subtitle, both Anton in brand
# cream #ECE4D3 (the subtitle ~21% the wordmark size, lowercase, matching the
# site) — centred on a large transparent square. The wide meta.png banner was
# truncated left/right and left odd edge gaps when Android centred it; text on
# transparency composites to the #0A0A0A `color` below, so letterboxing is
# invisible on every screen and nothing clips. The wordmark drives the width,
# landing at ~73% of the screen on every density (pointsize keeps it ~260dp =
# px/4, since the plugin treats the source as 4x and draws it centred at native
# size — bigger truncates). To regenerate (needs ImageMagick):
#   AF=assets/fonts/Anton-Regular.ttf
#   magick -background none -fill '#ECE4D3' -font $AF -pointsize 280 \
#     label:'LANDGRAB' -trim +repage /tmp/wm.png
#   magick -background none -fill '#ECE4D3' -font $AF -kerning 2 -pointsize 60 \
#     label:'a settler habit simulation' -trim +repage /tmp/sub.png
#   magick -size 2x40 xc:none /tmp/gap.png
#   magick -background none -gravity center /tmp/wm.png /tmp/gap.png /tmp/sub.png \
#     -append -gravity center -background none -extent 1440x1440 \
#     assets/splash/splash.png
# Then apply to the platforms: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A0A0A"
  image: assets/splash/splash.png
  # Fit the square wordmark to the screen width, centred (letterboxed top/
  # bottom in the same black, so no visible frame). iOS-only: Android's launch
  # bitmap has no aspect-fit gravity (fill_* distorts), and Android 12+ shows
  # the launcher icon via the system splash regardless — so Android keeps the
  # centred default.
  ios_content_mode: scaleAspectFit
  # Android 12+ uses the system splash: the launcher icon centred on the
  # window background. Set just the colour and let it show the LANDGRAB
  # adaptive icon rather than squeezing the wide banner into the icon slot.
  android_12:
    color: "#0A0A0A"

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  ios: true
  remove_alpha_ios: true
  android: "ic_launcher"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.local
    # Credits page copy. Directory form bundles whatever files are
    # present; the .txt bodies are gitignored (see assets/credits/README.md).
    - assets/credits/
    # Validator reference criteria (Markdown), shown in the validator's
    # Criteria tab. Edit assets/validation/criteria.md to change it.
    - assets/validation/
    # Player instructions (Markdown), shown on the Instructions page once the
    # simulation begins. Directory form bundles whatever's present; the
    # instructions.md body is gitignored (local-only, like credits — see
    # assets/instructions/README.md).
    - assets/instructions/
    # Server (Phoenix/Elixir) dependency license inventory + canonical
    # license texts, shown on the "Server open-source licenses" page.
    # server_deps.json is generated by `mix landgrab.licenses`.
    - assets/licenses/
    - assets/licenses/texts/
    # EXPERIMENT: street-aware territory. Directory form bundles whatever's
    # present; drop in blocks.geojson to enable (see assets/experimental/README.md).
    - assets/experimental/
  # Anton: the site wordmark's display face, bundled (not fetched)
  # so branding renders offline. Single weight; OFL licence sits
  # alongside the file.
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
